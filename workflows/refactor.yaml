id: refactor
goal: Reshape code safely without changing intended behavior or breaking contracts.
sequence:
  - role: tech-lead-orchestrator
    output: refactor boundary and invariants
  - role: integration-contract-keeper
    output: DTO and frontend consumer freeze or migration strategy
  - role: backend-implementer
    optional_when: backend surfaces are involved
    output: backend refactor across service, repository, and UoW seams
  - role: frontend-ui-implementer
    optional_when: presentation components, layout composition, styling structure, or accessibility seams are involved
    output: frontend UI refactor across component and layout seams
  - role: frontend-data-validation-implementer
    optional_when: client data access, async-data, store, form, or validation seams are involved
    output: frontend client-logic refactor across typed data, store, and validation seams
  - role: frontend-implementer
    optional_when: frontend surfaces are involved but remain too small or too coupled to split safely
    output: mixed frontend refactor across component, composable, store, and form seams
  - role: db-migration-owner
    optional_when: persistence shape changes
    output: Alembic migration strategy or no-op confirmation
  - role: qa-debugger
    output: regression safety check
  - role: reviewer-guard
    output: final risk review
done_when:
  - external behavior remains within agreed invariants
  - tests cover the changed seams
  - rollback or fallback paths are clear
