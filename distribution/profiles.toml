schema_version = 1
base_config = ".codex/config.toml"

# All profiles roll back handled failures before commit. After commit, cleanup
# interruptions retain installed files and must be reported as committed.

[profiles.full]
agents_template = "templates/project-AGENTS.md"
agents = [
  "backend_implementer",
  "db_migration_owner",
  "devops_release_owner",
  "frontend_data_validation_implementer",
  "frontend_implementer",
  "frontend_ui_implementer",
  "integration_contract_keeper",
  "qa_debugger",
  "reviewer_guard",
  "tech_lead_orchestrator",
]
skills = [
  "agent-browser",
  "api-contracts",
  "backend-dtos",
  "backend-exceptions",
  "backend-feature",
  "backend-logging",
  "backend-structure",
  "code-review",
  "codex-review-loop",
  "db-migration",
  "devops-release",
  "dishka-di",
  "fastapi-controllers",
  "frontend-data-access",
  "frontend-feature",
  "frontend-forms-and-validation",
  "frontend-structure",
  "pinia",
  "project-conventions",
  "repo-intake",
  "service-layer",
  "sqlalchemy-repositories",
  "task-decomposition",
  "test-debug",
  "unit-of-work",
  "vue",
  "web-design-guidelines",
]
stack = [
  { source = "stack/default-stack.yaml", target = "stack/default-stack.yaml" },
]
workflows = [
  { source = "workflows/bugfix.yaml", target = "workflows/bugfix.yaml" },
  { source = "workflows/feature-delivery.yaml", target = "workflows/feature-delivery.yaml" },
  { source = "workflows/refactor.yaml", target = "workflows/refactor.yaml" },
]

