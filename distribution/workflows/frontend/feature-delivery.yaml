id: feature-delivery
goal: Deliver a frontend feature with explicit ownership and final review.
sequence:
  - role: tech_lead_orchestrator
    output: scoped plan and ownership map
  - role: reviewer_guard
    optional_when: component, store, form, or data-access boundaries are reshaped
    output: boundary sanity check
  - role: frontend_ui_implementer
    optional_when: presentation, layout, accessibility, or component composition changes
    output: UI changes and verification notes
  - role: frontend_data_validation_implementer
    optional_when: data access, store, form, or validation behavior changes
    output: client-logic changes and verification notes
  - role: frontend_implementer
    optional_when: the frontend work is too small or coupled to split safely
    output: mixed frontend changes
  - role: qa_debugger
    output: regression sweep and risk notes
  - role: reviewer_guard
    output: final findings and release recommendation
done_when:
  - acceptance criteria are satisfied
  - impacted test suites pass
  - cross-role handoffs are recorded
error_handling:
  incomplete_handoff: return to the role that produced it before implementation continues
  acceptance_criteria_conflict: route to tech_lead_orchestrator to redefine scope before implementation continues
  boundary_widened: stop and route back to tech_lead_orchestrator to split structural prep or narrow scope
  wrong_landing_zone_detected: stop and return to tech_lead_orchestrator before more edits are made
  reviewer_guard_blocks: stop and surface Critical or High findings; selected Medium findings require requester disposition before merge
