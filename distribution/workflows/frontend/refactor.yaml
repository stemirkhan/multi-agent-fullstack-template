id: refactor
goal: Reshape frontend code without changing intended behavior or breaking contracts.
sequence:
  - role: tech_lead_orchestrator
    output: refactor boundary and invariants
  - role: reviewer_guard
    optional_when: component, store, form, or data-access boundaries are reshaped
    output: boundary sanity check
  - role: frontend_ui_implementer
    optional_when: presentation or component composition seams are involved
    output: UI refactor and verification notes
  - role: frontend_data_validation_implementer
    optional_when: data access, store, form, or validation seams are involved
    output: client-logic refactor and verification notes
  - role: frontend_implementer
    optional_when: the frontend work is too small or coupled to split safely
    output: mixed frontend refactor
  - role: qa_debugger
    output: regression safety check
  - role: reviewer_guard
    output: final risk review
done_when:
  - external behavior remains within agreed invariants
  - tests cover the changed seams
  - fallback paths are clear
error_handling:
  invariant_violated: stop and route back to tech_lead_orchestrator to redefine the refactor boundary
  contract_broken: stop and define a compatibility strategy before further code changes
  boundary_widened: stop and route back to tech_lead_orchestrator to split structural prep or narrow scope
  wrong_landing_zone_detected: stop and return to tech_lead_orchestrator before more edits are made
  incomplete_handoff: return to the producing role before proceeding to the next step
  reviewer_guard_blocks: stop and surface Critical or High findings; selected Medium findings require requester disposition before merge
