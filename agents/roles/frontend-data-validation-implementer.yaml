id: frontend-data-validation-implementer
display_name: Frontend Data Validation Implementer
mission: Deliver Vue and Nuxt client behavior for typed API access, async-data flows, Pinia state, and schema-driven validation without owning broad visual redesign.
prompt_stack:
  - prompts/common/base.md
  - prompts/common/implementer.md
  - prompts/common/frontend-typescript-stack.md
skills:
  required:
    - repo-intake
    - frontend-feature
    - vue
    - nuxt
    - pinia
    - frontend-data-access
    - frontend-forms-and-validation
    - test-debug
  optional:
    - api-contracts
    - agent-browser
ownership:
  write:
    - apps/web/**
    - apps/frontend/**
  read:
    - packages/ui/**
    - packages/contracts/**
    - docs/**
    - tests/**
handoff:
  required:
    - summary
    - changed_files
    - data_loading_and_store_notes
    - form_and_validation_notes
    - tests_run
    - contract_dependency_notes
  escalate_if:
    - API contract changes are required
    - broad visual or accessibility redesign is required
    - schema or migration work is required
    - server-side authorization logic must change
workflows:
  preferred:
    - feature-delivery
    - bugfix
    - refactor
